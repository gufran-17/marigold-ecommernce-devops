services:
  mongo:
    image: mongo:7
    container_name: marigold-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  
  backend:
    #build: ./backend
  
    image: 062000001375.dkr.ecr.ap-south-1.amazonaws.com/marigold-backend:latest
    container_name: marigold-backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/ecommerce_migrated
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  

  frontend:
    #build: ./frontend
    image: 062000001375.dkr.ecr.ap-south-1.amazonaws.com/marigold-frontend:latest
    container_name: marigold-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data: